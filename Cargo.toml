[package]
name = "axios-core"
version = "2026.9.27"
edition = "2021"
description = "Windows endpoint investigation and forensic evidence correlation platform"
repository = "https://github.com/Adam-dods/axios-windows-investigation"
readme = "README.md"
license = "Apache-2.0"
keywords = ["windows", "security", "forensics", "incident-response"]
categories = ["command-line-utilities"]

[dependencies]
notify = "6"
base64 = "0.22"
interprocess = "1.2"
subtle = "2"
walkdir = "2"
hex = "0.4"
sha2 = "0.10"
windows-service = "0.8"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
